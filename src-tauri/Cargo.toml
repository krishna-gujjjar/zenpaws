[package]
name = "zenpaws"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "ZenPaws - LAN peer-to-peer desktop messenger with desktop pets"

[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
base64 = "0.22"
bincode = "1.3.3"
mdns-sd = "0.18.2"
rcgen = "0.14.6"
rustls = "0.23"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio-rustls = "0.26.2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }

# See docs/05_TECHNICAL_DECISIONS.md for why each of these was chosen.
[workspace.lints.rust]
unused_must_use = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zenpaws_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "zenpaws"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

zenpaws-shared = { path = "crates/zenpaws-shared" }
zenpaws-network = { path = "crates/zenpaws-network" }
zenpaws-database = { path = "crates/zenpaws-database" }
zenpaws-pets = { path = "crates/zenpaws-pets" }
zenpaws-transfer = { path = "crates/zenpaws-transfer" }
zenpaws-notifications = { path = "crates/zenpaws-notifications" }
zenpaws-storage = { path = "crates/zenpaws-storage" }
zenpaws-settings = { path = "crates/zenpaws-settings" }

[lints]
workspace = true
